# AeroSpace — i3-inspired tiling window manager for macOS
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#
# Companion:
#   JankyBorders  — window highlight ring   (~/.config/borders/bordersrc)
#
# Modifier is alt (⌥). Layer two lives behind `alt-shift`; `alt-semicolon`
# drops into service mode and `alt-r` into resize mode for the rarer operations.

config-version = 2

# Off deliberately. This setup is floating-first (Ghostty tabs, Magnet, a menu
# bar full of utilities), and tiling only pays off if you restructure around it.
# The config below is kept intact -- flip this to true and relaunch to try again.
start-at-login = false
auto-reload-config = true

# No after-startup-command: borders runs as its own brew service now, so it
# does not depend on AeroSpace being up. Re-enabling AeroSpace needs no change
# here -- launching borders when an instance is already running is a no-op.

# ── normalization ─────────────────────────────────────────────────────────
# Keeps the tree tidy: collapses single-child containers and alternates
# orientation as you nest. Turn both off if you want manual tree control.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# ── behaviour ─────────────────────────────────────────────────────────────
automatically-unhide-macos-hidden-apps = true
focus-follows-mouse.enabled = false
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

key-mapping.preset = 'qwerty'

# Workspaces that exist even when empty, so alt-1..alt-9 always have a target.
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# ── gaps ──────────────────────────────────────────────────────────────────
# AeroSpace tiles inside the screen's visible frame, which already excludes
# the macOS menu bar, so the top gap is just breathing room like the others.
gaps.inner.horizontal = 10
gaps.inner.vertical   = 10
gaps.outer.left       = 10
gaps.outer.right      = 10
gaps.outer.bottom     = 10
gaps.outer.top        = 10

# ── window rules ──────────────────────────────────────────────────────────
# Anything that is a dialog, palette, or utility panel fights tiling — float
# it. Add bundle IDs with: aerospace list-windows --all --format '%{app-bundle-id}'
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    if.window-title-regex-substring = 'Info$'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.archiveutility'
    run = 'layout floating'

# Xcode refuses to shrink below a large minimum width, so sharing a workspace
# with it squeezes everything else and breaks even splits. Give it its own.
[[on-window-detected]]
    if.app-id = 'com.apple.dt.Xcode'
    run = 'move-node-to-workspace 2'

# Simulator resizes itself to the device aspect ratio — tiling it is a fight.
[[on-window-detected]]
    if.app-id = 'com.apple.iphonesimulator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.bitwarden.desktop'
    run = 'layout floating'

# ── modes ─────────────────────────────────────────────────────────────────
[mode.main.binding]

    # launchers
    alt-enter = 'exec-and-forget open -na Ghostty'
    alt-b     = 'exec-and-forget open -na "Brave Browser"'
    alt-e     = 'exec-and-forget open -a Finder .'
    alt-shift-s = 'exec-and-forget screencapture -i -c'

    # window
    alt-q = 'close'
    alt-f = 'fullscreen'
    alt-shift-space = 'layout floating tiling'

    # layout
    alt-slash    = 'layout tiles horizontal vertical'
    alt-comma    = 'layout accordion horizontal vertical'

    # focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # resize
    alt-minus  = 'resize smart -50'
    alt-equal  = 'resize smart +50'
    alt-shift-0 = 'balance-sizes'

    # workspaces
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
    alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
    alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
    alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
    alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
    alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
    alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
    alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
    alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

    # workspace navigation
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # modes
    alt-semicolon = 'mode service'
    alt-r         = 'mode resize'

[mode.service.binding]
    esc    = ['reload-config', 'mode main']
    r      = ['flatten-workspace-tree', 'mode main']   # reset the layout tree
    f      = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # join a window into its neighbour's container
    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = ['volume down', 'mode main']
    up   = ['volume up', 'mode main']
    shift-down = ['volume mute-toggle', 'mode main']

[mode.resize.binding]
    h = 'resize width -50'
    j = 'resize height +50'
    k = 'resize height -50'
    l = 'resize width +50'
    shift-0 = ['balance-sizes', 'mode main']
    enter = 'mode main'
    esc   = 'mode main'
